<!-- ===== "Before you start" intro deck (Use cases tab) =====
     Slide styles in story.css (.pgr-story); extra components are scoped to .pgr-intro.
     Keys while visible: ←/→ or PageUp/PageDown, N = talk track, F = full screen. -->
<div class="pgr-story pgr-intro" data-pgr-intro data-theme="light" lang="en" aria-label="Before you start: introduction slides"></div>
<style>
.pgr-intro{margin-bottom:22px}
.pgr-intro .ps-stage{min-height:700px}
.pgr-intro .ps-slide{overflow-y:auto}
/* session flow */
.pgr-intro .pi-flow{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1.25fr) 34px minmax(0,1fr);align-items:stretch}
.pgr-intro .pi-arw{display:grid;place-items:center;color:var(--faint);font-size:26px}
.pgr-intro .pi-st{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;border-block-start:5px solid var(--c)}
.pgr-intro .pi-st .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.pgr-intro .pi-st .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:650}
.pgr-intro .pi-st .t{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.15}
.pgr-intro .pi-st .p{font-size:14px;color:var(--muted);line-height:1.35}
.pgr-intro .pi-lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.pgr-intro .pi-lv span{font-size:12.5px;font-weight:600;border-radius:99px;padding:4px 10px;background:var(--soft);color:var(--ink)}
.pgr-intro .pi-lv span b{color:var(--accent)}
.pgr-intro .pi-lv span.o{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.pgr-intro .pi-aux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pgr-intro .pi-ax{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:10px 14px}
.pgr-intro .pi-ax .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--ink)}
.pgr-intro .pi-ax b{display:block;font-size:15px}
.pgr-intro .pi-ax span{font-size:13px;color:var(--muted)}
.pgr-intro .pi-auxl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:-8px}
/* 2 · chat, cowork, agent */
.pgr-intro .pi-modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pgr-intro .pi-mode{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;border-block-start:5px solid var(--c)}
.pgr-intro .pi-mode svg{width:100%;height:118px;display:block}
.pgr-intro .pi-mode .t{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1}
.pgr-intro .pi-mode .p{font-size:14px;color:var(--muted);line-height:1.35}
.pgr-intro .pi-mode .tag{align-self:flex-start;font-size:11.5px;font-weight:600;color:var(--c);background:var(--cs);border-radius:99px;padding:3px 10px;margin-top:2px}
.pgr-intro .pi-auto{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:-6px}
.pgr-intro .pi-auto i{height:4px;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--ochre),var(--accent));position:relative}
.pgr-intro .pi-auto i::after{content:'';position:absolute;right:-2px;top:50%;width:10px;height:10px;border-top:4px solid var(--accent);border-right:4px solid var(--accent);transform:translateY(-50%) rotate(45deg)}
.pgr-intro .pi-eq{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pgr-intro .pi-eq .lb{align-self:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650;width:100%;margin-bottom:2px}
.pgr-intro .pi-eq .op{align-self:center;font-family:var(--serif);font-size:24px;color:var(--faint);padding:0 2px}
.pgr-intro .pi-chip{flex:1 1 140px;border-radius:12px;padding:8px 12px;background:var(--cs);border-inline-start:4px solid var(--c)}
.pgr-intro .pi-chip b{display:block;font-size:15px;color:var(--ink)}
.pgr-intro .pi-chip span{font-size:12.5px;color:var(--muted)}
.pgr-intro .pi-chip.res{background:var(--ink);border-color:var(--accent)}
.pgr-intro .pi-chip.res b{color:var(--paper)}
.pgr-intro .pi-chip.res span{color:var(--paper);opacity:.75}
/* 3 · traps */
.pgr-intro .pi-traps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pgr-intro .pi-trap{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.pgr-intro .pi-trap .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.pgr-intro .pi-trap .n{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:650}
.pgr-intro .pi-trap .t{font-weight:650;font-size:17px;line-height:1.2;margin:1px 0 4px}
.pgr-intro .pi-trap .p{font-size:14px;color:var(--muted);line-height:1.35}
.pgr-intro .pi-trap .g{font-size:13.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pgr-intro .pi-trap .g b{color:var(--verify)}
@media (max-width:900px){.pgr-intro .pi-modes,.pgr-intro .pi-traps,.pgr-intro .pi-flow,.pgr-intro .pi-aux{grid-template-columns:1fr}.pgr-intro .pi-arw{transform:rotate(90deg);height:30px}.pgr-intro .ps-stage{min-height:980px}}
</style>
<script>
(function(){

/* mini diagrams for chat, cowork and agent (220×118) */
var arrowDef = function(id,c){ return '<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="'+c+'"/></marker></defs>'; };

function ai(x,y,c){ return '<g><rect x="'+(x-21)+'" y="'+(y-21)+'" width="42" height="42" rx="11" fill="'+c+'"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">AI</text></g>'; }
var SV = {
  chat: '<svg viewBox="0 0 220 118" aria-hidden="true">'+arrowDef('mA','var(--blue)')+
    node(42,59,'You','var(--soft)','var(--ink)')+ai(178,59,'var(--blue)')+
    '<path d="M66 48 C100 30 120 30 152 46" fill="none" stroke="var(--blue)" stroke-width="2.2" marker-end="url(#mA)"/>'+
    '<path d="M154 72 C120 88 100 88 68 72" fill="none" stroke="var(--faint)" stroke-width="2.2" marker-end="url(#mA)"/>'+
    '<text x="110" y="25" text-anchor="middle" font-size="11" fill="var(--muted)">prompt</text><text x="110" y="104" text-anchor="middle" font-size="11" fill="var(--muted)">answer</text></svg>',
  cowork: '<svg viewBox="0 0 220 118" aria-hidden="true">'+arrowDef('mB','var(--ochre)')+
    node(36,32,'You','var(--soft)','var(--ink)')+ai(184,32,'var(--ochre)')+
    '<g fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"><rect x="88" y="66" width="30" height="38" rx="4"/><rect x="96" y="60" width="30" height="38" rx="4"/><rect x="104" y="54" width="30" height="38" rx="4"/></g>'+
    '<path d="M110 64h16M110 70h16M110 76h10" stroke="var(--faint)" stroke-width="2" stroke-linecap="round"/>'+
    '<path d="M162 44 C150 56 146 62 140 66" fill="none" stroke="var(--ochre)" stroke-width="2.2" marker-end="url(#mB)"/>'+
    '<path d="M58 40 C70 52 76 58 84 70" fill="none" stroke="var(--faint)" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#mB)"/>'+

    '<text x="110" y="20" text-anchor="middle" font-size="11" fill="var(--muted)">step by step</text><text x="164" y="104" text-anchor="middle" font-size="11" fill="var(--muted)">your files</text></svg>',
  agent: '<svg viewBox="0 0 220 118" aria-hidden="true">'+arrowDef('mC','var(--accent)')+
    '<g transform="translate(16 30)"><path d="M0 0v34" stroke="var(--ink)" stroke-width="2"/><path d="M0 0h18l-4 6 4 6H0z" fill="var(--accent)"/></g><text x="22" y="82" text-anchor="middle" font-size="11" fill="var(--muted)">goal</text>'+
    '<path d="M42 46h30" stroke="var(--faint)" stroke-width="2.2" marker-end="url(#mC)"/>'+
    '<circle cx="110" cy="52" r="36" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-dasharray="6 5"/>'+ai(110,52,'var(--accent)')+
    '<text x="110" y="10" text-anchor="middle" font-size="10.5" fill="var(--muted)">plan</text><text x="152" y="96" text-anchor="middle" font-size="10.5" fill="var(--muted)">act</text><text x="68" y="96" text-anchor="middle" font-size="10.5" fill="var(--muted)">check</text>'+
    '<g stroke="var(--line)" stroke-width="1.5" fill="var(--surface)"><rect x="168" y="12" width="40" height="22" rx="6"/><rect x="168" y="40" width="40" height="22" rx="6"/><rect x="168" y="68" width="40" height="22" rx="6"/></g>'+
    '<g font-size="10" font-weight="600" fill="var(--ink)" text-anchor="middle"><text x="188" y="27">search</text><text x="188" y="55">code</text><text x="188" y="83">files</text></g>'+
    '<path d="M146 30l20-6M146 52h20M146 70l20 8" stroke="var(--faint)" stroke-width="1.5"/></svg>'
};

var S = [];
S.push({t:'How this tool works', note:'Step 1: you rate the use cases for your research – how valuable, what kind of gain, how feasible. Step 2: you pick one to three of your best-rated use cases and try them with your AI assistant. Each one comes with a starter prompt and a check, and you can climb the levels: chat, project or notebook, custom assistant. Results shows what you – or all groups in a workshop – rated and tested. Alongside are practice data – papers and raw datasets you can use instead of your own unpublished material – and an overview of academic extensions and tools.',
 html: head('1 · How this tool works','Rate, <em>try</em>, compare.')+
 '<div class="ps-body" style="gap:18px"><div class="pi-flow">'+
   '<div class="pi-st rv" style="--d:180;--c:var(--blue);--cs:var(--blue-soft)"><span class="ic">'+ico('rate',26)+'</span><div class="k">Step 1</div><div class="t">Research value</div><div class="p">You rate the use cases: value, kind of gain, feasibility.</div></div>'+
   '<div class="pi-arw rv" style="--d:300" aria-hidden="true">→</div>'+
   '<div class="pi-st rv" style="--d:380;--c:var(--accent);--cs:var(--accent-soft)"><span class="ic">'+ico('test',26)+'</span><div class="k">Step 2</div><div class="t">Try it with AI</div><div class="p">One to three of your best use cases – with a starter prompt and a check.</div><div class="pi-lv"><span><b>1</b> Chat</span><span><b>2</b> Project / Notebook</span><span><b>3</b> Custom assistant</span><span class="o">4 Automation / own code</span></div></div>'+
   '<div class="pi-arw rv" style="--d:500" aria-hidden="true">→</div>'+
   '<div class="pi-st rv" style="--d:580;--c:var(--verify);--cs:var(--verify-soft)"><span class="ic">'+ico('results',26)+'</span><div class="k">Results</div><div class="t">What you found</div><div class="p">Rankings and tests – in a workshop for all groups, by discipline.</div></div>'+
 '</div><div class="pi-auxl rv" style="--d:700">Alongside</div><div class="pi-aux">'+
   '<div class="pi-ax rv" style="--d:760"><span class="ic">'+ico('data')+'</span><div><b>Practice data</b><span>Open papers and raw data to use instead of your own unpublished work.</span></div></div>'+
   '<div class="pi-ax rv" style="--d:840"><span class="ic">'+ico('tools')+'</span><div><b>Academic Extensions &amp; Tools</b><span>Specialist tools beyond a general assistant – and how they connect.</span></div></div>'+
 '</div></div>'+
 link([['Step 2','<b>Three levels: chat, project / notebook, custom assistant.</b> What changes along the way?']])});

S.push({t:'Chat, project, custom assistant', note:'Three ways to work with AI. In a chat you ask, it answers – you steer every single step. In the middle, a project or notebook: it works with you on your files and keeps sources, rules and answers in one place, and you check each step. A custom assistant – and, one step further, an agent – pursues a goal with standing instructions: it plans, acts and checks in a loop. The more autonomy, the more it needs: a clear goal, the right context – instructions, your files, memory – and tools such as search, code or a connector to a database. And the more you have to check.',
 html: head('2 · Three ways to work with AI','From <em>chat</em> to <em>agent</em>.')+
 '<div class="ps-body" style="gap:16px"><div class="pi-modes">'+[
   ['chat','blue','Chat','You ask, it answers. You steer every step.','One conversation'],
   ['cowork','ochre','Project / Notebook','It works with you on your files and keeps them together. You check each step.','Projects · notebooks'],
   ['agent','accent','Custom assistant / agent','It pursues a goal with standing instructions – with context and tools. You set goal and limits.','Custom assistants · agents']
 ].map(function(m,i){ return '<div class="pi-mode rv" style="--d:'+(180+i*160)+';--c:var(--'+m[1]+');--cs:var(--'+m[1]+'-soft)">'+SV[m[0]]+'<div class="t">'+m[2]+'</div><div class="p">'+m[3]+'</div><span class="tag">'+m[4]+'</span></div>'; }).join('')+
 '</div><div class="pi-auto rv" style="--d:650"><span>You steer every step</span><i></i><span>AI runs the loop</span></div>'+
 '<div class="pi-eq rv" style="--d:800"><span class="lb">An agent needs more than a chat</span>'+
   [['Model','the language model','ink','soft'],['Context','instructions · your files · memory','blue','blue-soft'],['Tools','search · code · connectors (MCP)','verify','verify-soft'],['Goal & loop','plan · act · check','ochre','ochre-soft']].map(function(c,i){
     return (i?'<span class="op">+</span>':'')+'<div class="pi-chip" style="--c:var(--'+c[2]+');--cs:var(--'+c[3]+')"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>'; }).join('')+
   '<span class="op">=</span><div class="pi-chip res"><b>Agent</b><span>Step 2: levels 1 → 4</span></div></div></div>'});

S.push({t:'Four traps', note:'Where does AI make academic work harder? Four traps. First, transparency: which step was yours, which was the AI’s, and could an examiner retrace it? Second, contradictions: fluent text hides claims that clash across sections. Third, white spots: AI writes smoothly over what it does not know – missing literature, questions nobody asked. Fourth, assumptions: hidden premises in your prompt or in its answer quietly become the foundation of your work. Every exercise in Step 2 has a check built in for exactly these traps.',
 html: head('3 · Research with AI','Four traps in <em>academic work</em> with AI.')+
 '<div class="ps-body"><div class="pi-traps">'+[
   ['trace','Transparency & traceability','Which step was yours, which was the AI’s – and could someone retrace it?','Log prompts, versions and decisions as you go.'],
   ['clash','Contradictions in the argument','Fluent text hides claims that clash across sections and chapters.','Ask for every contradiction – then check each one yourself.'],
   ['blank','White spots','AI writes smoothly over what it does not know: missing literature, unasked questions.','Ask what is missing and compare with your own search.'],
   ['assume','(Flawed) assumptions','Hidden premises in your prompt or its answer become the base of your work.','Make assumptions explicit and test them against the source.']
 ].map(function(t,i){ return '<div class="pi-trap rv" style="--d:'+(200+i*140)+'"><span class="ic">'+ico(t[0],28)+'</span><div><div class="n">Trap '+(i+1)+'</div><div class="t">'+t[1]+'</div><div class="p">'+t[2]+'</div><div class="g"><b>Guard:</b> '+t[3]+'</div></div></div>'; }).join('')+
 '</div></div>'+
 link([['Step 1','<b>Every exercise in Step 2 has a check</b> – a number, a quote or a page to verify.']])});

/* ---------- engine (same behaviour as the survey story) ---------- */
function init(root){
  if(!root || root.__pgr) return; root.__pgr = true;
  root.innerHTML =
   '<div class="ps-top"><span class="ps-brand"><b>Before you start</b> · Where does AI actually help me?</span><span class="ps-chapter" aria-live="polite"></span></div>'+
   '<div class="ps-progress"><i></i></div><div class="ps-stage"><div class="ps-scale">'+S.map(function(s,i){return '<section class="ps-slide" data-i="'+i+'" aria-roledescription="slide" aria-label="'+(i+1)+' of '+S.length+': '+esc(s.t)+'">'+s.html+'</section>';}).join('')+'</div></div>'+
   '<div class="ps-notes" role="note"><div class="nh">Talk track</div><div class="nt"></div></div>'+
   '<nav class="ps-nav" aria-label="Intro navigation"><button type="button" class="ps-btn" data-act="prev">← Back</button><div class="ps-dots">'+S.map(function(s,i){return '<button type="button" data-go="'+i+'" aria-label="Go to '+(i+1)+': '+esc(s.t)+'"></button>';}).join('')+'</div>'+
   '<button type="button" class="ps-btn" data-act="notes" aria-pressed="false" title="Talk track (N)">Notes</button><button type="button" class="ps-btn" data-act="fs" title="Full screen (F)">⛶</button><button type="button" class="ps-btn pri" data-act="next">Next →</button></nav>';
  var slides = root.querySelectorAll('.ps-slide'), dots = root.querySelectorAll('.ps-dots button'), cur = -1, visible = false;
  function go(i){
    i = Math.max(0, Math.min(S.length-1, i)); if(i===cur) return;
    slides.forEach(function(sl,k){ sl.classList.toggle('is-on',k===i); sl.classList.toggle('is-prev',k<i); sl.setAttribute('aria-hidden', k===i?'false':'true'); if('inert' in sl) sl.inert = k!==i; });
    if(root.classList.contains('is-fit')) fit();
    dots.forEach(function(d,k){ if(k===i) d.setAttribute('aria-current','step'); else d.removeAttribute('aria-current'); });
    root.querySelector('.ps-chapter').textContent = (i+1)+' / '+S.length+' · '+S[i].t;
    root.querySelector('.ps-progress i').style.width = (100*(i+1)/S.length)+'%';
    root.querySelector('[data-act="prev"]').disabled = i===0;
    root.querySelector('[data-act="next"]').disabled = i===S.length-1;
    root.querySelector('.ps-notes .nt').textContent = S[i].note || '';
    cur = i; slides[i].scrollTop = 0;
  }
  root.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b || !root.contains(b)) return;
    var a = b.getAttribute('data-act');
    if(a==='next') go(cur+1); else if(a==='prev') go(cur-1);
    else if(a==='notes'){ var on = root.classList.toggle('show-notes'); b.setAttribute('aria-pressed', on); }
    else if(a==='fs'){ if(document.fullscreenElement) document.exitFullscreen(); else if(root.requestFullscreen) root.requestFullscreen(); }
    else if(b.hasAttribute('data-go')) go(+b.getAttribute('data-go'));
  });
  document.addEventListener('keydown', function(e){
    if(!visible || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var tg = e.target; if(tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))) return;
